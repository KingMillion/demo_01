name: Build Tauri ARM64

on:
  push:
    branches: [ main ] # 或者你使用的分支名，如 master
  workflow_dispatch: # 允许你在网页上手动点击触发

jobs:
  build:
    runs-on: ubuntu-22.04 # 与你的 KICKPI 系统版本一致，避免兼容性问题
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            gcc-aarch64-linux-gnu

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build Tauri app for ARM64
        run: |
          npm install
          npm run tauri build -- --target aarch64-unknown-linux-gnu

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-deb
          path: src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb