name: Build Tauri ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      # 关键：显式用 npm 安装依赖，避免 tauri-action 误检测 pnpm 而卡死
      - name: Install dependencies with npm
        run: npm install

      # 关键：通过环境变量强制 tauri-action 使用 npm
      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target aarch64-unknown-linux-gnu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 告诉 tauri-action 用 npm，不要自动检测
          TAURI_ACTION_PACKAGE_MANAGER: npm

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-deb
          path: src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
